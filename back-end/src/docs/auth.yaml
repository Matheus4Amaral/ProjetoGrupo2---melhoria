paths:
  /api/auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Login realizado com sucesso }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastra um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                nome_usuario: { type: string }
                nome_empresa: { type: string }
                email: { type: string, format: email }
                senha: { type: string, minLength: 6, format: password }
                cpf_cnpj: { type: string }
                telefone: { type: string }
                cep:
                  type: string
                  example: 36700-020
      responses:
        '201': { description: Usuário cadastrado com sucesso }
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                message: CEP inválido. Informe um CEP com 8 dígitos.
                code: INVALID_CEP
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/forgot-password:
    post:
      tags: [Autenticação]
      summary: Verifica o e-mail para recuperação de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: E-mail encontrado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/user:
    get:
      tags: [Autenticação]
      summary: Busca um usuário pelo identificador
      parameters:
        - in: query
          name: id_usuario
          schema: { type: integer }
      responses:
        '200': { description: Usuário encontrado }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/user/update:
    put:
      tags: [Autenticação]
      summary: Atualiza os dados de um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_usuario: { type: integer }
                nome_usuario: { type: string }
                nome_empresa: { type: string }
                telefone: { type: string }
                cep: { type: string }
      responses:
        '200': { description: Usuário atualizado }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
