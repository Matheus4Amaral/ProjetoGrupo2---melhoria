paths:
  /api/dashboard/getDashboardData:
    get:
      tags: [Dashboard]
      summary: Obtém os indicadores do dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Indicadores retornados }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/dashboard/replacement:
    post:
      tags: [Dashboard]
      summary: Registra uma reposição de produto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_produto, id_estoque, quantidade_reposicao]
              properties:
                id_produto: { type: integer }
                id_estoque: { type: integer }
                quantidade_reposicao: { type: number }
      responses:
        '200': { description: Reposição realizada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
