paths:
  /api/products:
    get:
      tags: [Produtos]
      summary: Lista os produtos do usuário
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Produtos retornados }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Produtos]
      summary: Cadastra um produto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome_produto, categoria, preco_compra, preco_venda, quantidade_inicial, id_estoque]
              properties:
                nome_produto: { type: string }
                categoria: { type: string }
                preco_compra: { type: number }
                preco_venda: { type: number }
                quantidade_inicial: { type: number }
                id_estoque: { type: integer }
                id_fornecedor: { type: integer, nullable: true }
      responses:
        '201': { description: Produto cadastrado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/products/search/nome:
    get:
      tags: [Produtos]
      summary: Busca produtos por nome
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: nome
          required: true
          schema: { type: string }
      responses:
        '200': { description: Produtos encontrados }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/products/{id}:
    get:
      tags: [Produtos]
      summary: Busca um produto
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Produto encontrado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Produtos]
      summary: Atualiza um produto
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome_produto: { type: string }
                categoria: { type: string }
                preco_compra: { type: number }
                preco_venda: { type: number }
                id_fornecedor: { type: integer, nullable: true }
      responses:
        '200': { description: Produto atualizado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Produtos]
      summary: Exclui um produto
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Produto excluído }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
